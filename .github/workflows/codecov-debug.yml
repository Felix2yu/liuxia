# 临时实验 workflow：4 种上传方式分离变量，用完即删
# 每个 job 上传后在 codecov Uploads 页以 exp-<name> 显示各自状态
name: codecov-debug

on:
  workflow_dispatch:

jobs:
  exp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A-go-default      # 对照：复刻 CI 现状（Go CLI + flag backend）
            cmd: go
          - variant: B-no-flag         # 变量1：去掉 flag
            cmd: noflag
          - variant: D-legacy          # 变量2：legacy 上传端点
            cmd: legacy
          - variant: F-python-cli      # 对照：复刻 9-21 成功配方（Python CLI）
            cmd: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload to codecov
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -u
          n="exp-${{ matrix.variant }}"
          case "${{ matrix.cmd }}" in
            go)
              curl -sSfL https://cli.codecov.io/latest/linux/codecov -o /tmp/cc
              chmod +x /tmp/cc
              /tmp/cc upload-coverage -t "$TOKEN" --git-service github -f coverage.out -F backend -n "$n"
              ;;
            noflag)
              curl -sSfL https://cli.codecov.io/latest/linux/codecov -o /tmp/cc
              chmod +x /tmp/cc
              /tmp/cc upload-coverage -t "$TOKEN" --git-service github -f coverage.out -n "$n"
              ;;
            legacy)
              curl -sSfL https://cli.codecov.io/latest/linux/codecov -o /tmp/cc
              chmod +x /tmp/cc
              /tmp/cc upload-coverage -t "$TOKEN" --git-service github -f coverage.out -F backend -n "$n" --legacy
              ;;
            python)
              pip install -q codecov-cli
              codecov upload-coverage -t "$TOKEN" --git-service github -f coverage.out -F backend -n "$n"
              ;;
          esac
