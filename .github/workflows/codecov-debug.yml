# 临时诊断 workflow：检查 codecov CLI 能力，用完即删
name: codecov-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download codecov CLI and inspect
        run: |
          curl -sSfL https://cli.codecov.io/latest/linux/codecov -o codecov
          chmod +x codecov
          echo "===== version ====="
          ./codecov --version 2>&1 | head -5
          echo "===== upload-coverage --help ====="
          ./codecov upload-coverage --help 2>&1
