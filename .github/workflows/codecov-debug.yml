# 临时诊断 workflow：查询 Codecov 服务端对该仓库的处理状态，用完即删
name: codecov-debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Codecov API
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -u
          echo "===== 1) 对照组 huozhi（正常仓库）repo 信息 ====="
          curl -s -H "Authorization: token $TOKEN" "https://api.codecov.io/api/v2/github/felix2yu/huozhi/" | head -c 1500; echo
          echo "===== 2) 对照组 huozhi commits ====="
          curl -s -H "Authorization: token $TOKEN" "https://api.codecov.io/api/v2/github/felix2yu/huozhi/commits/?page_size=2" | head -c 2500; echo
          echo "===== 3) liuxia 大写 slug ====="
          curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: token $TOKEN" "https://api.codecov.io/api/v2/github/Felix2yu/liuxia/" | head -c 1500; echo
          echo "===== 4) 无认证对照 ====="
          curl -s -w "\nHTTP %{http_code}\n" "https://api.codecov.io/api/v2/github/felix2yu/huozhi/" | head -c 800; echo
          echo "===== 5) token 有效性（whoami 类端点） ====="
          curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: token $TOKEN" "https://api.codecov.io/api/v2/users/" | head -c 800; echo
