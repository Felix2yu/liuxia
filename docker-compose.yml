services:
  liuxia:
    container_name: liuxia
    image: ghcr.io/felix2yu/liuxia:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - CITY=江苏省-苏州
      - BASE_URL=https://sunsetbot.top/
      - PUSH_ENABLE=true
      - PUSH_MARKDOWN=true
      # 使用 apprise URL（推荐，支持多渠道）
      - PUSH_URL=ntfy://ntfy.sh/Weather,tgram://bot-token/chatid
      - SEND_TEST_ON_START=false
      - PUSH_ERROR=true
      - MORNING_ENABLE=true
      - MORNING_TIME=18:00,00:00
      - MORNING_MODEL=GFS,EC
      - EVENING_ENABLE=true
      - EVENING_TIME=08:00,11:30,16:00
      - EVENING_MODEL=GFS,EC
      - DB_PATH=/app/data/liuxia.db
      # 外部备份工具（docker-db-auto-backup）经 docker exec 触发本应用的导出：
      #   docker exec liuxia /app/liuxia backup > liuxia.db
      # SQLite 没有可连的服务端，热拷贝 .db/-wal/-shm 会拷出损坏副本，故由应用用
      # VACUUM INTO 在进程内产出一致性快照。exec 身份由下方 PUID/PGID 自动推导，
      # 无需再声明 BACKUP_SQLITE_USER。
      - BACKUP_SQLITE_CMD=/app/liuxia backup
      - WEB_PORT=8080
      - PUID=1000
      - PGID=1000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
